name: Metrics
on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: JunYier
          template: classic
          config_timezone: Asia/Shanghai
          plugin_languages: yes
          plugin_languages_limit: 6
